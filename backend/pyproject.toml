[project]
name = "assessx-backend"
version = "0.1.0"
description = "AssessX API — FastAPI modular monolith"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "SIM"]
ignore = ["S101", "N818"]  # asserts in tests; HTTP error classes named after their status

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"app/cli.py" = ["S105", "S106"]
