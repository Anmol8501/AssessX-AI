# Daily encrypted database backup, monthly restore drill, and a heartbeat to the API (Phase 8 final, CX-06).
#
# Needs repository secrets (Settings → Secrets and variables → Actions), set by the owner:
#   BACKUP_DATABASE_URL  — a Supabase connection URL that can read the database (session pooler)
#   BACKUP_PASSPHRASE    — 16+ characters; keep a copy in the password manager (without it nothing restores)
#   MAINTENANCE_TOKEN    — the same value as Render's MAINTENANCE_TOKEN
# and the repository variable ASSESSX_API_URL (e.g. https://assessx-backend-0nw6.onrender.com).
#
# The backup is encrypted (GnuPG AES-256) before it is uploaded as a workflow artifact kept 30 days; the
# plaintext dump never leaves the runner and is deleted by the script. If this job stops reporting success,
# the API raises a `backup_missing` alert (BACKUP_MAX_AGE_HOURS, default 26). docs/DISASTER-RECOVERY.md.

name: Backup

on:
  schedule:
    - cron: "17 2 * * *" # daily, 02:17 UTC
    - cron: "47 3 1 * *" # monthly: backup + restore drill
  workflow_dispatch:
    inputs:
      drill:
        description: "Run restore drill verification"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      drill:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: drill
          POSTGRES_PASSWORD: drill-only-throwaway
          POSTGRES_DB: assessx_restore_drill
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U drill" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      BACKUP_DIR: /tmp/assessx-backups
      BACKUP_KEEP: "1"
      ASSESSX_API_URL: ${{ vars.ASSESSX_API_URL || vars.API_URL || 'https://assessx-backend-0nw6.onrender.com' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: PostgreSQL 17 client tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Encrypted backup
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: python3 infrastructure/backup/backup.py
      - name: Keep the encrypted backup (30 days)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assessx-backup-${{ github.run_id }}
          path: /tmp/assessx-backups/assessx-*.dump.gpg*
          retention-days: 30
          if-no-files-found: error
      - name: Restore drill into a throwaway database
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.drill != false }}
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          RESTORE_DATABASE_URL: postgresql://drill:drill-only-throwaway@localhost:5432/assessx_restore_drill
          SOURCE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          latest=$(find "$BACKUP_DIR" -name 'assessx-*.dump.gpg' | sort | tail -1)
          if [ -z "$latest" ] || [ ! -f "$latest" ]; then
            echo "::error::No backup file found in $BACKUP_DIR to run restore drill."
            exit 1
          fi
          echo "Verifying throwaway database container readiness..."
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U drill; then
              echo "Throwaway PostgreSQL service is ready."
              break
            fi
            echo "Waiting for throwaway database service ($i/30)..."
            sleep 1
          done
          if ! pg_isready -h localhost -p 5432 -U drill; then
            echo "::error::Disposable PostgreSQL database service on localhost:5432 could not be reached."
            exit 1
          fi
          echo "Executing restore drill against throwaway database..."
          python3 infrastructure/backup/restore.py "$latest" --compare-with-env SOURCE_URL --clean-after
      - name: Report restore drill skipped notice
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.drill == false }}
        run: |
          echo "::warning::Restore drill was explicitly bypassed by manual workflow_dispatch input (drill=false). Backup artifact is NOT fully verified."
      - name: Report success
        env:
          API: ${{ vars.ASSESSX_API_URL || vars.API_URL || 'https://assessx-backend-0nw6.onrender.com' }}
          TOKEN: ${{ secrets.MAINTENANCE_TOKEN }}
        run: |
          API_BASE="${API%/}"
          if [ -z "$API_BASE" ]; then
            echo "::error::No API base URL configured. Set ASSESSX_API_URL repository variable."
            exit 1
          fi
          latest=$(find "$BACKUP_DIR" -name 'assessx-*.dump.gpg' | sort | tail -1)
          if [ -z "$latest" ] || [ ! -f "$latest" ]; then
            echo "::error::Backup file not found in $BACKUP_DIR"
            exit 1
          fi
          size=$(stat -c %s "$latest")
          echo "Reporting successful backup to $API_BASE/api/v1/internal/maintenance/backup-heartbeat (size: $size bytes)"
          curl -fsS --retry 3 --retry-delay 20 -X POST "$API_BASE/api/v1/internal/maintenance/backup-heartbeat" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "{\"status\":\"success\",\"size_bytes\":$size}"
      - name: Report failure
        if: ${{ failure() }}
        env:
          API: ${{ vars.ASSESSX_API_URL || vars.API_URL || 'https://assessx-backend-0nw6.onrender.com' }}
          TOKEN: ${{ secrets.MAINTENANCE_TOKEN }}
        run: |
          API_BASE="${API%/}"
          if [ -z "$API_BASE" ]; then
            echo "::warning::No API base URL configured. Cannot report backup failure heartbeat."
            exit 0
          fi
          echo "Reporting backup failure to $API_BASE/api/v1/internal/maintenance/backup-heartbeat"
          curl -sS --retry 3 --retry-delay 20 -X POST "$API_BASE/api/v1/internal/maintenance/backup-heartbeat" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d '{"status":"failure","note":"backup workflow failed"}' || true
