[package]
name = "assessx-desktop"
version = "0.1.0"
description = "AssessX desktop application"
edition = "2021"

[lib]
# Distinct lib name avoids a bin/lib name clash on Windows (rust-lang/cargo#8519).
name = "assessx_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Phase 4B: the low-level keyboard hook, window/system queries (lockdown), device-readiness process
# enumeration (readiness) and the read-only kiosk edition check (kiosk). Already in the dependency
# tree through Tauri; only the listed Win32 API surfaces are enabled.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
