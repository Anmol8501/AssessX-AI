[package]
name = "assessx-desktop"
version = "0.1.0"
description = "AssessX desktop application"
edition = "2021"

[lib]
# Distinct lib name avoids a bin/lib name clash on Windows (rust-lang/cargo#8519).
name = "assessx_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
